name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build standalone app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaskBubble --icon task_bubble.ico --add-data "task_bubble_icon.png;." --add-data "task_bubble.ico;." --add-data "close.wav;." task_bubble.pyw

      - name: Package app and installer scripts
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'TaskBubble-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $package 'assets') -Force | Out-Null
          Copy-Item dist\TaskBubble.exe, install.ps1, uninstall.ps1, README.md, LICENSE $package
          Copy-Item assets\task-bubble-ui.png (Join-Path $package 'assets')
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath "TaskBubble-$env:VERSION-windows-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TaskBubble-*-windows-x64.zip
